<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes - API Client</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>QuickNotes</h1>

        <!-- Create Note Form (Task 2) -->
        <section class="card">
            <h2>Create New Note</h2>
            <form id="note-form">
                <div class="form-group">
                    <label for="title">Title (required, max 100 chars):</label>
                    <input type="text" id="title" name="title" maxlength="100" required>
                </div>
                <div class="form-group">
                    <label for="body">Body (optional):</label>
                    <textarea id="body" name="body"></textarea>
                </div>
                <button type="submit" id="submit-btn">Create Note</button>
            </form>
            <p id="form-status" class="status-msg" aria-live="polite"></p>
        </section>

        <!-- Load & Delete Notes Section (Task 1 & 3) -->
        <section class="card">
            <div class="section-header">
                <h2>Saved Notes</h2>
                <button id="load-btn">Load notes</button>
            </div>
            <p id="load-status" class="status-msg" aria-live="polite"></p>
            <div id="notes-container" class="notes-list">
                <p class="empty-state">No notes loaded yet. Click "Load notes" to fetch from the server.</p>
            </div>
        </section>
    </main>

    <script src="api.js"></script>
</body>
</html>
