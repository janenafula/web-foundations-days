<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Character Counter & Dark Mode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Live Character Counter</h1>
            <button id="theme-toggle" class="btn">Toggle Theme</button>
        </header>

        <main>
            <textarea id="note-text" placeholder="Start typing your note here..."></textarea>
            
            <div class="counter-container">
                <p>Characters: <span id="char-count">0</span> / 200</p>
                <p>Words: <span id="word-count">0</span></p>
            </div>

            <button id="clear-btn" class="btn danger">Clear Text</button>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
